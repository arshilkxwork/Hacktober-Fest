name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q

  examples:
    name: examples (replay recorded runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Replay the examples with the recorded model output
        run: |
          for dir in examples/pep-*/; do
            n=$(basename "$dir" | cut -d- -f2)
            decisiontrail eval-pep "$n" --pep-file "$dir/pep-$n.rst" --thread "$dir/thread.json" \
              --replay "$dir/model-responses.json" --judge --out "/tmp/replay-$n" > /dev/null
            diff -u "$dir/report.md" "/tmp/replay-$n/report.md"
          done
          decisiontrail check-pr --store examples/pr-check/decisions.json --diff examples/pr-check/change.diff \
            --no-repo --output /tmp/pr-check.md > /dev/null
          diff -u examples/pr-check/report.md /tmp/pr-check.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint Python
        run: ruff check .

  package:
    name: package (build, install, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/decisiontrail --help
          /tmp/clean/bin/decisiontrail serve --port 8799 --examples examples &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8799/api/health > /dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8799/api/stats | python -c "import json, sys; t = json.load(sys.stdin)['totals']; assert t['decisions'] > 0, t; print(t)"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        working-directory: web
        run: npm ci
      - name: Type-check and build the web app
        working-directory: web
        run: npm run build
