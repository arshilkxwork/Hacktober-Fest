name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Replay the examples with the recorded model output
        run: |
          for dir in examples/pep-*/; do
            n=$(basename "$dir" | cut -d- -f2)
            decisiontrail eval-pep "$n" --pep-file "$dir/pep-$n.rst" --thread "$dir/thread.json" \
              --replay "$dir/model-responses.json" --judge --out "/tmp/replay-$n" > /dev/null
            diff -u "$dir/report.md" "/tmp/replay-$n/report.md"
          done
          decisiontrail check-pr --store examples/pr-check/decisions.json --diff examples/pr-check/change.diff \
            --no-repo --output /tmp/pr-check.md > /dev/null
          diff -u examples/pr-check/report.md /tmp/pr-check.md

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.6"
      - name: Lint Python
        run: ruff check .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web app
        working-directory: web
        run: npm ci
      - name: Type-check and build the web app
        working-directory: web
        run: npm run build
