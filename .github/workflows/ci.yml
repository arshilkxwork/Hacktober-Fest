name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Replay the examples with the recorded model output
        run: |
          for dir in examples/pep-*/; do
            n=$(basename "$dir" | cut -d- -f2)
            decisiontrail eval-pep "$n" --pep-file "$dir/pep-$n.rst" --thread "$dir/thread.json" \
              --replay "$dir/model-responses.json" --judge --out "/tmp/replay-$n" > /dev/null
            diff -u "$dir/report.md" "/tmp/replay-$n/report.md"
          done
